name: tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (undefined names / syntax)
        run: ruff check modpilot tests --select F,E9
      - name: Tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
